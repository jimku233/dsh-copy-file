# dsh-copy-file bundle patch.
#
# Adds one action of its own beside the delivery card's "Open in" split button.
# `deliverables.file.actions` is declared `kind: list`, so this row coexists with
# the shipped `ui-open-in-app` instead of replacing it: nothing upstream is
# disabled, an upstream upgrade cannot silently roll the shipped UI back, and
# there is no vendored browser bundle to regenerate.
#
# presentation:
#   menu  (default) the button plus a chevron that opens the rest
#   icon  a single button; the same menu opens on right-click
#
# The card menu carries a "use the other look" row, so the choice can be made
# without editing any file; that saved choice wins over this value.
#
- insert:
    - id: dsh-copy-file
      name: dsh-copy-file
      config:
        presentation: menu
