name: test

on:
  push:
    branches: [main]
  pull_request:

# 同一 ref 只保留最新一次运行；被取代的停在 cancelled，不是失败。
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }}
    # 只跑 Windows：这个包的交付路径解析、剪贴板写入（CF_HDROP）和卡片交互都是
    # Windows 语义，`presented` 的用例也直接用 `D:\ws` 这类路径。放到 Linux 上
    # 跑只会把"不是 Windows"当成失败信号，反而掩盖真实回归。
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 浏览器半是单文件、无构建步骤：先确认它能被解析。
      - name: Syntax check
        run: node --check lib/client.js

      - name: Tests
        shell: bash
        run: node --test tests/client.test.mjs tests/presented.test.mjs tests/routes.test.mjs tests/clipboard.test.mjs
